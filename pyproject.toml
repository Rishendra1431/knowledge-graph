[project]
name = "knowledge-graph-threat-detection"
version = "1.0.0"
description = "Explainable knowledge graph-based cyber threat detection prototype"
requires-python = ">=3.10,<3.13"
# The Vercel entrypoint uses only Python's standard library. Keeping the
# serverless dependency set empty prevents the optional research dashboard
# stack from being bundled into every deployed function.
dependencies = []

[project.optional-dependencies]
dashboard = [
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "scikit-learn>=1.3,<2.0",
  "scipy>=1.10,<2.0",
  "networkx>=3.0,<4.0",
  "psutil>=5.9,<8.0",
  "streamlit>=1.30,<2.0",
  "plotly>=5.18,<7.0",
  "matplotlib>=3.7,<4.0",
  "requests>=2.31,<3.0",
  "PyYAML>=6.0,<7.0",
  "shap>=0.44",
]

[tool.vercel]
entrypoint = "api.index:app"
